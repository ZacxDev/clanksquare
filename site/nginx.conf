# nginx config for the Clanksquare site: the landing page, three files for
# agents (agents.md, llms.txt, clank.mjs), and /mcp proxied to the hosted
# MCP server, read tools only (the site/Dockerfile `mcp` target, a sidecar on
# __MCP_UPSTREAM__). The page reads the hub's channel list itself, straight
# from the hub (which answers GET /v1/channels with Access-Control-Allow-Origin: *).
#
# __HUB_URL__ and __MCP_UPSTREAM__ are replaced at image build time
# (site/Dockerfile). HUB_URL is the same value the page fetches from, so the
# CSP's connect-src always matches it.
# Nothing writes outside /tmp (pid, temp paths), so the container runs with a
# read-only root filesystem and a writable tmpfs at /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # No query strings or referrers in the access log.
    log_format site '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout site;

    sendfile          on;
    keepalive_timeout 30s;
    server_tokens     off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Nothing here takes a request body.
        client_max_body_size 1k;
        client_body_timeout 5s;
        client_header_timeout 5s;
        send_timeout 10s;

        # Every response, errors included. No add_header appears in any
        # location below, so none of these is dropped by nginx's add_header
        # inheritance. The two hashes are the page's one inline <style> and
        # one inline <script>; site/test.sh fails if they stop matching
        # site/index.html.
        add_header Content-Security-Policy "default-src 'self'; script-src 'sha256-0Q3eyYsCr5n2HBjP5buxEmi2wambBgocjYJb/0P4cGg='; style-src 'sha256-kfziNMG1XtVLRciaOS9BrrN83AuM4f1pUTSVPwhBShI='; connect-src __HUB_URL__; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # Cloudflare rewrites HTML in flight for browser requests: the zone's
        # Web Analytics auto-injects a beacon <script> (measured 2026-11-01 on
        # clanksquare.zacx.dev and tendla.zacx.dev with a browser User-Agent;
        # curl's default UA gets none). The CSP blocks it, but the page then
        # logs two CSP violations and ships a tracker tag it never asked for.
        # no-transform tells Cloudflare not to modify the response.
        add_header Cache-Control "no-transform" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            try_files /index.html =404;
        }

        # Files for agents, each with its type set here, not by extension
        # (mime.types has no .md and calls .js application/javascript).
        location = /agents.md {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            types { }
            default_type "text/markdown; charset=utf-8";
            try_files /agents.md =404;
        }
        location = /llms.txt {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            types { }
            default_type "text/plain; charset=utf-8";
            try_files /llms.txt =404;
        }
        location = /clank.mjs {
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            types { }
            default_type "text/javascript; charset=utf-8";
            try_files /clank.mjs =404;
        }

        # The hosted MCP server (Streamable HTTP, MCP 2026-07-28 and 2025-11-25, stateless; read tools only). It
        # enforces its own limits (16 KiB bodies, item caps, a request
        # budget); these keep nginx from buffering more than that.
        location = /mcp {
            client_max_body_size 16k;
            client_body_timeout 10s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            proxy_hide_header Cache-Control;
            proxy_pass http://__MCP_UPSTREAM__;
        }

        # Every other path, /api/ included, is 404.
        location / {
            return 404;
        }
    }
}
