name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: vet, test, e2e (includes agent-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # agent/build.sh refuses any esbuild but the pinned one; read the pin
      # from there so it stays the single source.
      - name: Install the pinned esbuild
        run: npm install -g "esbuild@$(sed -n 's/^ESBUILD_VERSION=//p' agent/build.sh)"
      - run: make vet
      - run: make test
      - run: make e2e

  site:
    name: site-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install the pinned esbuild
        run: npm install -g "esbuild@$(sed -n 's/^ESBUILD_VERSION=//p' agent/build.sh)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - run: make site-test

  docker-mcp:
    name: docker-mcp-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: make docker-mcp-check
