# Main nginx config for the Clanksquare site. It replaces the image's default
# so that nothing writes outside /tmp: the server block is rendered from
# templates/site.conf.template into /tmp/site.conf at start (the image's
# envsubst entrypoint, NGINX_ENVSUBST_OUTPUT_DIR=/tmp), and every temp path,
# the cache and the pid file are under /tmp. With a read-only root
# filesystem, mount a writable tmpfs at /tmp.
load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # No query strings or referrers in the access log.
    log_format site '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout site;

    sendfile          on;
    keepalive_timeout 30s;
    server_tokens     off;

    js_import apiguard from /etc/nginx/apiguard.js;

    include /tmp/site.conf;
}
